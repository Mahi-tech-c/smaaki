<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#db2777" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>

  <!-- Glowing Inner Plate -->
  <circle cx="256" cy="270" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Artisanal Coffee Cup Icon -->
  <g transform="translate(106, 110)" filter="url(#softGlow)">
    <!-- Steam / Flourishing Petals -->
    <path d="M 60 40 Q 75 10, 60 -15 Q 45 -40, 60 -65" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M 150 40 Q 165 5, 150 -25 Q 135 -55, 150 -80" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <path d="M 240 40 Q 255 10, 240 -15 Q 225 -40, 240 -65" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

    <!-- Cup Body -->
    <path d="M 30 70 L 270 70 C 270 200, 230 250, 150 250 C 70 250, 30 200, 30 70 Z" fill="#ffffff"/>
    
    <!-- Cup Lip Highlight -->
    <rect x="25" y="65" width="250" height="16" rx="8" fill="#fdf2f8"/>

    <!-- Cup Handle -->
    <path d="M 265 105 C 320 105, 320 190, 260 195" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>

    <!-- Blooming Heart Emblem inside Cup -->
    <path d="M 150 170 C 150 170, 105 130, 105 108 C 105 92, 118 80, 133 80 C 142 80, 148 85, 150 90 C 152 85, 158 80, 167 80 C 182 80, 195 92, 195 108 C 195 130, 150 170, 150 170 Z" fill="#db2777"/>
  </g>
</svg>
