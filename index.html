  <style>
    :root {
      --splash-size: 120px;
      --splash-bg: #db2777;
    }

    html, body {
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      background: var(--splash-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .splash-logo {
      width: var(--splash-size);
      height: var(--splash-size);
      background: white;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 25px 50px rgba(219, 39, 119, 0.25);
      margin-bottom: 24px;
      animation: splash-pulse 2s infinite ease-in-out;
    }

    .splash-text {
      color: white;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    .splash-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>

  <script>
    // Track when the page was first loaded
    window.__pageLoadTime = Date.now();

    // Handle iOS Safari BFCache: only reload if the page is genuinely stale (>30 min)
    // This prevents the jarring flash/glitch on every back/forward navigation
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        var ageMs = Date.now() - (window.__pageLoadTime || 0);
        var thirtyMinutes = 30 * 60 * 1000;
        if (ageMs > thirtyMinutes) {
          window.location.reload();
        }
      }
    });

    // Global function to hide splash screen, called by React when data is fresh
    window.hideSplashScreen = function () {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('splash-hidden');
        // Remove from DOM after transition
        setTimeout(() => {
          splash.style.display = 'none';
        }, 500);
      }
    };

    // Fallback: Hide after 5 seconds if React fails to load
    setTimeout(() => {
      if (window.hideSplashScreen) window.hideSplashScreen();
    }, 5000);
  </script>
